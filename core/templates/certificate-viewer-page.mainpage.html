<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Certificate Of Achievement - {{ certificate_name }}</title>
    <style>
      body {
        background-color: #f0f0f0;
        display: flex;
        align-items: center;
        font-family: 'Georgia', serif;
        height: 100vh;
        justify-content: center;
        margin: 0;
      }
      .certificate-container {
        background: white;
        border: 20px solid #00645c;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
        padding: 50px;
        position: relative;
        text-align: center;
        width: 800px;
      }
      .certificate-header {
        color: #00645c;
        font-size: 50px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }
      .certificate-subheader {
        font-size: 24px;
        font-style: italic;
        margin-bottom: 40px;
      }
      .learner-name {
        border-bottom: 2px solid #333;
        display: inline-block;
        font-size: 40px;
        font-weight: bold;
        margin-bottom: 20px;
        padding: 0 20px;
      }
      .certificate-text {
        font-size: 20px;
        line-height: 1.6;
        margin: 30px 0;
      }
      .certificate-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 60px;
        padding: 0 50px;
      }
      .signature {
        border-top: 1px solid #333;
        font-weight: bold;
        padding-top: 10px;
        width: 200px;
      }
      .oppia-logo {
        color: #00645c;
        font-size: 30px;
        font-weight: bold;
      }
      .print-btn {
        background: #00645c;
        border: none;
        color: white;
        cursor: pointer;
        padding: 10px 20px;
        position: absolute;
        right: 10px;
        top: 10px;
      }
      .certificate-name {
        font-size: 28px;
        font-weight: bold;
      }
      .footer-label {
        font-size: 14px;
      }
      @media print {
        .print-btn { display: none; }
        body { background: white; }
        .certificate-container { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="certificate-container">
      <button class="print-btn" onclick="window.print()">Print PDF</button>

      <div class="certificate-header">Certificate of Achievement</div>
      <div class="certificate-subheader">This is to certify that</div>

      <div class="learner-name">{{ learner_name }}</div>

      <div class="certificate-text">
        has successfully passed the assessment for<br>
        <span class="certificate-name">{{ certificate_name }}</span><br>
        on the Oppia Learning Platform with a score of {{ score }}%.
      </div>

      <div class="certificate-footer">
        <div>
          <div class="signature">Oppia Foundation</div>
          <div class="footer-label">Organization</div>
        </div>
        <div class="oppia-logo">OPPIA</div>
        <div>
          <div class="signature">{{ date_earned }}</div>
          <div class="footer-label">Date Issued</div>
        </div>
      </div>
    </div>
  </body>
</html>
